<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - FitPulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-role="Public">
<nav id="nav"></nav>

<div class="narrow">
  <div class="box">
    <h1 style="text-align:center">Join FitPulse 💪</h1>
    <p class="muted" style="text-align:center">Create your account in a minute</p>

    <form id="registerForm">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label>User ID</label>
      <input type="text" id="userId" placeholder="Choose a User ID">

      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="10 digit phone number">

      <label>Password</label>
      <div class="pw">
        <input type="password" id="password" placeholder="Create password">
        <button type="button" onclick="showPassword('password')">👁</button>
      </div>

      <label>Confirm Password</label>
      <div class="pw">
        <input type="password" id="confirm" placeholder="Confirm password">
        <button type="button" onclick="showPassword('confirm')">👁</button>
      </div>

      <label>I am joining as</label>
      <select id="role">
        <option value="">Select account type</option>
        <option>Member</option>
        <option>Coach</option>
      </select>

      <button class="btn full" type="submit">Create Account</button>
      <p class="msg" id="message"></p>
    </form>

    <p style="text-align:center" class="muted">Already have an account? <a href="Login.html" style="color:#ff6b35">Login</a></p>
  </div>
</div>

<script src="app.js"></script>
<script>
function showPassword(id) {
  const x = document.getElementById(id);
  x.type = x.type === "password" ? "text" : "password";
}

document.getElementById("registerForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const userId = document.getElementById("userId").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const role = document.getElementById("role").value;
  const msg = document.getElementById("message");

  if (!name || !userId || !email || !phone || !password || !confirm || !role) return say(msg, "Please fill all fields.", false);
  if (phone.length !== 10 || isNaN(phone)) return say(msg, "Enter a valid 10 digit phone number.", false);
  if (password.length < 6) return say(msg, "Password must contain at least 6 characters.", false);
  if (password !== confirm) return say(msg, "Passwords do not match.", false);

  try {
    const { ok, data } = await send("/register", "POST", { userId, name, email, phone, password, role });
    say(msg, data.message, ok);
    if (ok) setTimeout(() => (window.location.href = "Login.html"), 1200);
  } catch (err) {
    say(msg, "Server connection failed.", false);
  }
});
</script>
</body>
</html>
